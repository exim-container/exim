name: Release

on:
  push:
    branches:
      - main
    paths:
      - Containerfile
      - Makefile-Linux
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if the image content is unchanged
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/exim

jobs:
  version:
    name: Version
    if: github.repository_owner == 'exim-container'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      inputs: ${{ steps.version.outputs.inputs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^ENV EXIM_VERSION=\(.*\)$/\1/p' Containerfile)"
          if [ -z "${version}" ]; then
            echo "EXIM_VERSION not found in the Containerfile" >&2
            exit 1
          fi
          last="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${version}-r" --jq '.[].ref' \
            | sed -n "s|^refs/tags/${version//./\\.}-r\([0-9]\+\)$|\1|p" | sort -n | tail -n 1)"
          tag="${version}-r$(( ${last:-0} + 1 ))"
          inputs="$(grep -v '^ENV DEBIAN_SNAPSHOT=' Containerfile | cat - Makefile-Linux | sha256sum | cut -d ' ' -f 1)"
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "inputs=${inputs}"
          } >> "${GITHUB_OUTPUT}"
          echo "Releasing ${tag}" >> "${GITHUB_STEP_SUMMARY}"

  image:
    name: Image ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=exim
            org.opencontainers.image.description=Exim mail transfer agent built from the upstream release tags on Debian 13
            org.opencontainers.image.licenses=GPL-2.0-or-later
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: exim:test
          labels: ${{ steps.meta.outputs.labels }}
      - name: Smoke test
        run: scripts/smoke-test.sh exim:test
      - name: List the packages
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p packages
          docker run --rm exim:test dpkg-query -W -f '${Package}=${Version}\n' | sort | sed "s/^/${ARCH} /" > "packages/${ARCH}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.arch }}
          path: packages/*
          if-no-files-found: error
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/${{ matrix.arch }}
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  publish:
    name: Publish
    needs:
      - version
      - image
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      INPUTS: ${{ needs.version.outputs.inputs }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true
      - id: compare
        name: Compare with the previous release
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        run: |
          {
            echo "exim ${VERSION}"
            echo "inputs ${INPUTS}"
            cat packages/*.txt
          } > release.txt
          if ! gh release download --repo "${GITHUB_REPOSITORY}" --pattern release.txt --output previous.txt 2>/dev/null; then
            : > previous.txt
          fi
          if [ "${FORCE}" != "true" ] && cmp -s previous.txt release.txt; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "Nothing changed since the previous release, nothing published" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          echo "changed=true" >> "${GITHUB_OUTPUT}"
          join -a 1 -a 2 -e none -o 0,1.2,2.2 \
            <(sed -n 's/^amd64 \([^=]*\)=/\1 /p' previous.txt | sort -k 1,1) \
            <(sed -n 's/^amd64 \([^=]*\)=/\1 /p' release.txt | sort -k 1,1) \
            | awk '$2 != $3 { printf "- `%s` %s → %s\n", $1, $2, $3 }' > changes.md
      - if: steps.compare.outputs.changed == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.compare.outputs.changed == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: manifest
        if: steps.compare.outputs.changed == 'true'
        name: Create the manifest list
        working-directory: digests
        run: |
          minor="${VERSION%.*}"
          major="${VERSION%%.*}"
          tags=()
          for tag in "${TAG}" "${VERSION}" "${minor}" "${major}" latest; do
            tags+=(--tag "${IMAGE}:${tag}")
          done
          sources=()
          for digest in *; do
            sources+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.description=Exim mail transfer agent built from the upstream release tags on Debian 13" \
            --annotation "index:org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.licenses=GPL-2.0-or-later" \
            --annotation "index:org.opencontainers.image.version=${VERSION}" \
            "${sources[@]}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - if: steps.compare.outputs.changed == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - name: Create the release
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          {
            echo "Exim ${VERSION}, built from the upstream tag \`exim-${VERSION}\` on Debian 13."
            echo
            if [ -s changes.md ] && [ -s previous.txt ]; then
              echo "Updated packages:"
              echo
              cat changes.md
              echo
            fi
            echo '```sh'
            echo "docker pull ${IMAGE}:${TAG}"
            echo '```'
            echo
            echo "Digest: \`${DIGEST}\`"
          } > notes.md
          gh release create "${TAG}" release.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Exim ${VERSION} (${TAG##*-})" \
            --notes-file notes.md \
            --generate-notes \
            --latest

  cleanup:
    name: Clean up untagged images
    needs: publish
    if: always() && needs.publish.result != 'skipped'
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: exim
          delete-untagged: true
