name: Release

on:
  push:
    branches:
      - main
    paths:
      - Containerfile
      - Makefile-Linux
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/exim

jobs:
  version:
    name: Version
    if: github.repository_owner == 'exim-container'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^ENV EXIM_VERSION=\(.*\)$/\1/p' Containerfile)"
          if [ -z "${version}" ]; then
            echo "EXIM_VERSION not found in the Containerfile" >&2
            exit 1
          fi
          last="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${version}-r" --jq '.[].ref' \
            | sed -n "s|^refs/tags/${version//./\\.}-r\([0-9]\+\)$|\1|p" | sort -n | tail -n 1)"
          tag="${version}-r$(( ${last:-0} + 1 ))"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Releasing ${tag}" >> "${GITHUB_STEP_SUMMARY}"

  image:
    name: Image ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=exim
            org.opencontainers.image.description=Exim mail transfer agent built from the upstream release tags on Debian 13
            org.opencontainers.image.licenses=GPL-2.0-or-later
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: exim:test
          labels: ${{ steps.meta.outputs.labels }}
      - name: Smoke test
        run: scripts/smoke-test.sh exim:test
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/${{ matrix.arch }}
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  publish:
    name: Publish
    needs:
      - version
      - image
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: manifest
        name: Create the manifest list
        working-directory: digests
        run: |
          minor="${VERSION%.*}"
          major="${VERSION%%.*}"
          tags=()
          for tag in "${TAG}" "${VERSION}" "${minor}" "${major}" latest; do
            tags+=(--tag "${IMAGE}:${tag}")
          done
          sources=()
          for digest in *; do
            sources+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.description=Exim mail transfer agent built from the upstream release tags on Debian 13" \
            --annotation "index:org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.licenses=GPL-2.0-or-later" \
            --annotation "index:org.opencontainers.image.version=${VERSION}" \
            "${sources[@]}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          {
            echo "Exim ${VERSION}, built from the upstream tag \`exim-${VERSION}\` on Debian 13."
            echo
            echo '```sh'
            echo "docker pull ${IMAGE}:${TAG}"
            echo '```'
            echo
            echo "Digest: \`${DIGEST}\`"
          } > notes.md
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Exim ${VERSION} (${TAG##*-})" \
            --notes-file notes.md \
            --generate-notes \
            --latest
